# Tesla Jr. - Nav2 파라미터 (지도 없이 odom 프레임 로컬 내비게이션)
# =====================================================================
# - 사전 지도/SLAM 없음 (map_server, AMCL 미사용)
# - global frame = odom, rolling window costmap
# - 장애물 소스 = /stereo/left/points (Isaac depth 포인트클라우드)
# - 차동 구동 (Nova Carter). use_sim_time = false (전부 wall-clock)
#
# 실행: ros2 launch nav2_bringup navigation_launch.py \
#         params_file:=<이 파일> use_sim_time:=false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 3.15   # Ackermann 은 제자리 회전 불가 -> 최종 yaw 무시
      stateful: True

    # MPPI: 궤적 샘플링 최적화 컨트롤러. RPP(경로추종)와 달리 매 스텝 수천 개
    # 미래 궤적을 샘플링해 최적을 고름 -> 좁은 공간에서 '길게 후진 -> 각 잡고
    # 전진' 같은 의도적 다단 기동(3점턴) 가능. Ackermann 모델 + 후진(vx_min<0) 허용.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40                # 2.0s 지평 (가볍게: bringup 타임아웃/저FPS 대응)
      model_dt: 0.05
      batch_size: 1000              # 2000->1000 (설정/런타임 부담 절반)
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.7                 # 속도 상향 (0.5->0.7)
      vx_min: -0.35                # 후진 허용 (음수)
      vy_max: 0.5
      wz_max: 1.9
      ax_max: 3.0
      ax_min: -3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 1.0          # 차량 최소회전반경
      # PreferForwardCritic: 전진 선호(weight 5) -> 평소엔 전진, 다른 크리틱이
      # 우세할 때만(빡빡한 코너 등) 후진. 빼면 미로 시작부터 엉뚱하게 후진함.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1                     # 1=양방향(후진 진입 허용)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true    # 실제 사각 footprint 로 충돌검사 (긴 차체)
        collision_cost: 1000000.0
        near_goal_distance: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # 실제 차체 box 1.0(L)x0.6(W) + 약간 마진. 원형반경 대신 사각 footprint
      # 라야 코너에서 벽에 안 붙고 길이를 제대로 인식해 넓게 돈다.
      footprint: "[[0.55, 0.33], [0.55, -0.33], [-0.55, -0.33], [-0.55, 0.33]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: front left right bump
        front:
          topic: /stereo/left/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.2
        left:
          topic: /left_cam/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.2
        right:
          topic: /right_cam/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.2
        bump:                          # 가상 범퍼 추론 장애물 (후면 등 미관측 벽)
          topic: /virtual_bumper/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      # 실제 차체 box 1.0(L)x0.6(W) + 약간 마진. 원형반경 대신 사각 footprint
      # 라야 코너에서 벽에 안 붙고 길이를 제대로 인식해 넓게 돈다.
      footprint: "[[0.55, 0.33], [0.55, -0.33], [-0.55, -0.33], [-0.55, 0.33]]"
      track_unknown_space: false
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: front left right bump
        # global 은 누적(persistent) 지도: clearing=False -> 한 번 본 벽은 유지.
        # 지나친 뒤쪽 벽을 안 잊어버려서 후진/재계획 시 박지 않음.
        front:
          topic: /stereo/left/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.2
        left:
          topic: /left_cam/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.2
        right:
          topic: /right_cam/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.2
        bump:                          # 가상 범퍼 추론 장애물 (persistent)
          topic: /virtual_bumper/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.35
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # Smac Hybrid-A* : Ackermann 기구학 반영 경로 (최소회전반경 준수 + 후진/다점선회)
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"   # 후진 허용 (DUBIN=전진만)
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 1.0              # 로봇 최소반경(~0.95m) 보다 약간 크게
      reverse_penalty: 0.5                      # 낮춤 -> 긴 후진 경로도 꺼리지 않음
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 1.9]
    min_velocity: [-0.35, 0.0, -1.9]   # 후진속도 MPPI(vx_min -0.35)와 일치 (안 깎이게)
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
